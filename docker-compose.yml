version: '3.8'

services:
  stockbridge-db:
    image: postgres:16-alpine
    container_name: stockbridge-postgres
    restart: always
    environment:
      POSTGRES_DB: stockbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  stockbridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockbridge-server
    restart: always
    depends_on:
      stockbridge-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=stockbridge-db;Port=5432;Database=stockbridge;Username=postgres;Password=password123!
      - Webhooks__SigningSecret=stockbridge-webhook-secret-key-2026
    ports:
      - "5000:5000"

volumes:
  pgdata:
